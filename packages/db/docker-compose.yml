name: scholar-seek

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: scholar-seek-postgres
    environment:
      POSTGRES_DB: scholar-seek
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - scholar-seek_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scholar-seek-redis
    ports:
      - "6379:6379"
    volumes:
      - scholar-seek_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  scholar-seek_postgres_data:
  scholar-seek_redis_data:
